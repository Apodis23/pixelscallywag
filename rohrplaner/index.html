<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rohrplaner – Rohre & Fittinge planen</title>
<meta name="description" content="Kostenloser Rohrplaner: Rohre und Fittinge bis 1 Zoll für Heizung und Trinkwasser zusammenstecken und Teileliste erstellen.">
<meta name="theme-color" content="#1f6feb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span class="brand-name">Rohrplaner</span></div>
  <input id="projName" class="projname" type="text" aria-label="Projektname">
  <select id="medium" aria-label="Medium">
    <option value="tw" data-i18n="medTw">Trinkwasser kalt</option>
    <option value="tww" data-i18n="medTww">Trinkwasser warm + kalt</option>
    <option value="hz" data-i18n="medHz">Heizung</option>
  </select>
  <div class="tb-group">
    <button id="btnUndo" class="icon" data-i18n-title="undo" title="Rückgängig">↶</button>
    <button id="btnRedo" class="icon" data-i18n-title="redo" title="Wiederholen">↷</button>
  </div>
  <div class="tb-group">
    <button id="btnHints" class="tb-btn"><span class="ico">⚠</span><span class="lbl" data-i18n="hints">Hinweise</span><span id="hintBadge" class="badge" hidden>0</span></button>
    <button id="btnList" class="tb-btn primary"><span class="ico">☰</span><span class="lbl" data-i18n="partsList">Teileliste</span></button>
    <button id="btnMenu" class="tb-btn"><span class="ico">📁</span><span class="lbl" data-i18n="projects">Projekte</span></button>
    <button id="btnLang" class="icon small" title="Sprache / Language">EN</button>
    <button id="btnInfo" class="icon small" title="Info">?</button>
  </div>
</header>

<div id="main">
  <aside id="library" aria-label="Teilebibliothek">
    <div class="lib-head">
      <input id="libSearch" type="search" data-i18n-ph="search" placeholder="Teil suchen, z. B. „16“ oder „Kugelhahn“">
      <button id="libClose" class="icon only-mobile" title="Schließen">✕</button>
    </div>
    <p class="lib-tip" data-i18n="libTip">Tippen = an das markierte Teil anstecken · Ziehen = frei platzieren</p>
    <div id="libList"></div>
  </aside>

  <section id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="gridSmall" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e3e8ef" stroke-width="1"/></pattern>
        <pattern id="gridBig" width="400" height="400" patternUnits="userSpaceOnUse"><rect width="400" height="400" fill="url(#gridSmall)"/><path d="M400 0H0V400" fill="none" stroke="#c9d2de" stroke-width="1.5"/></pattern>
        <pattern id="braid" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#d5dae0"/><path d="M0 0V6M3 0V6" stroke="#9aa3ad" stroke-width="1.2"/></pattern>
      </defs>
      <g id="view">
        <rect id="gridRect" x="-20000" y="-20000" width="40000" height="40000" fill="url(#gridBig)"/>
        <g id="world"></g>
        <g id="overlay"></g>
      </g>
    </svg>
    <div id="drawBanner" hidden><span id="drawText"></span><button id="drawDone" data-i18n="done">Fertig</button></div>
    <div id="emptyHint" hidden>
      <h2 data-i18n="emptyTitle">Los geht's!</h2>
      <p data-i18n="emptyText">Ziehe ein Teil aus der Liste links auf die Fläche – oder öffne ein Beispiel.</p>
      <button id="emptyExamples" class="primary" data-i18n="openExample">Beispiel öffnen</button>
    </div>
    <div id="zoomCtl">
      <button id="zoomIn" class="icon" title="Zoom +">＋</button>
      <button id="zoomOut" class="icon" title="Zoom −">－</button>
      <button id="zoomFit" class="icon" data-i18n-title="fit" title="Alles zeigen">⤢</button>
    </div>
    <button id="libOpen" class="fab only-mobile"><span>＋</span> <span data-i18n="parts">Teile</span></button>
    <div id="selBar" hidden>
      <div class="sel-info"><strong id="selName"></strong><span id="selPorts"></span></div>
      <div class="sel-len" id="selLenBox" hidden>
        <label><span data-i18n="length">Länge</span> <input id="selLen" type="number" min="1" step="1" inputmode="numeric"> cm</label>
        <button id="selLenReset" class="small" data-i18n-title="lenReset" title="Länge aus Zeichnung">↺</button>
      </div>
      <div class="sel-btns">
        <button id="selRot" title="Drehen (R)">↻ <span class="lbl" data-i18n="rotate">Drehen</span></button>
        <button id="selFlip" title="Spiegeln (F)">⇋ <span class="lbl" data-i18n="flip">Spiegeln</span></button>
        <button id="selDup" title="Duplizieren (Strg+D)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6.5" y="6.5" width="10" height="10" rx="2"/><path d="M13 4.5V4a1.5 1.5 0 0 0-1.5-1.5h-7A1.5 1.5 0 0 0 3 4v7a1.5 1.5 0 0 0 1.5 1.5H5"/></svg> <span class="lbl" data-i18n="duplicate">Kopie</span></button>
        <button id="selDel" class="danger" title="Löschen (Entf)">🗑 <span class="lbl" data-i18n="delete">Löschen</span></button>
      </div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="disclaimerBar" data-i18n="disclaimerShort">Planungshilfe – ersetzt keinen Fachbetrieb.</div>
  </section>
</div>

<!-- Dialog -->
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-head"><h2 id="modalTitle"></h2><button id="modalClose" class="icon" title="Schließen">✕</button></div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- Druckbereich -->
<div id="printArea"></div>

<div id="splash" hidden><div class="splash-in"><img src="icons/icon.svg" alt="" width="84" height="84"><h1>Rohrplaner</h1><p>Pixel Scallywag</p></div></div>

<script src="parts.js"></script>
<script src="i18n.js"></script>
<script src="info.js"></script>
<script src="examples.js"></script>
<script src="ai-stub.js"></script>
<script src="app.js"></script>
</body>
</html>
